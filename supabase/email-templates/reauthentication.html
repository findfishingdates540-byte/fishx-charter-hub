<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0D161F;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0D161F;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#14202B;border:1px solid #22333F;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 8px 32px;">
                <div style="font-size:20px;font-weight:700;letter-spacing:.04em;color:#E8F2F6;">FISH-X.COM</div>
                <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#2DE2F2;margin-top:4px;">Bookings &amp; Marketplace</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px;">
                <h1 style="margin:0 0 12px 0;font-size:26px;line-height:1.25;color:#E8F2F6;font-weight:600;">Your verification code</h1>
                <p style="margin:0 0 18px 0;font-size:15px;line-height:1.6;color:#8AA2B0;">
                  Enter this code to confirm it's really you.
                </p>
                <div style="display:inline-block;background:#0D161F;border:1px solid #22333F;border-radius:12px;padding:16px 28px;font-size:30px;letter-spacing:.32em;font-weight:700;color:#2DE2F2;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 32px 28px 32px;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#8AA2B0;">The code expires in a few minutes. Never share it with anyone.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;border-top:1px solid #22333F;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#6C8494;">
                  Didn't request this? Ignore the email — nothing changes.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
